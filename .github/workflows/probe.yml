name: Daily probe
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      sample:
        description: 'Probe only a sample of this size (empty = whole registry)'
        required: false
        default: ''
concurrency:
  group: probe
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Exact Claude counts come from the free count_tokens endpoint. Without the key the run keeps the o200k estimate only.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch the previous run's servers.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/previous
          # The artifact is uploaded after a successful import, so the newest one is also the state of D1.
          for id in $(gh run list --workflow "Daily probe" --status success --limit 10 --json databaseId -q '.[].databaseId'); do
            if gh run download "$id" --name "probe-$id" --dir data/previous 2>/dev/null; then echo "previous run $id"; break; fi
          done
          test -f data/previous/data/latest/servers.json && cp data/previous/data/latest/servers.json data/previous/servers.json || echo "::notice::No previous run found, importing everything."
          test -f data/previous/data/latest/hosts.json && cp data/previous/data/latest/hosts.json data/previous/hosts.json || true
      - name: Probe the registry
        run: |
          if [ -n "${{ inputs.sample }}" ]; then
            npm run probe --silent -- --sample "${{ inputs.sample }}" --per-host 2 --out data/raw/probe-run.json --claude-cache data/previous/servers.json
          else
            npm run probe --silent -- --all --concurrency 24 --out data/raw/probe-run.json --claude-cache data/previous/servers.json
          fi
      - name: Build the site data and the D1 import
        run: |
          node --import tsx probe/build-data.ts --in data/raw/probe-run.json --out data/latest
          if [ -f data/previous/servers.json ]; then
            node --import tsx probe/to-sql.ts --in data/latest --out data/latest/import.sql --previous data/previous/servers.json --previous-hosts data/previous/hosts.json
          else
            node --import tsx probe/to-sql.ts --in data/latest --out data/latest/import.sql
          fi
      - name: Import into D1
        if: ${{ inputs.sample == '' && env.CLOUDFLARE_API_TOKEN != '' }}
        working-directory: site
        run: npx wrangler d1 execute mcp-pulse --remote --file=../data/latest/import.sql
      - name: Keep the run as an artifact
        # After the import, so the next run diffs against what D1 really holds. A sample run keeps its raw file only.
        if: ${{ inputs.sample == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: probe-${{ github.run_id }}
          path: |
            data/raw/probe-run.json
            data/latest/servers.json
            data/latest/hosts.json
          retention-days: 90
          compression-level: 9
      - name: Tell IndexNow which pages changed
        if: ${{ inputs.sample == '' && env.CLOUDFLARE_API_TOKEN != '' }}
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: node --import tsx probe/indexnow.ts --changed data/latest/changed.json
      - name: Say when the import was skipped
        if: ${{ inputs.sample == '' && env.CLOUDFLARE_API_TOKEN == '' }}
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set, so the run was not imported into D1."
      - name: Commit the summary
        if: ${{ inputs.sample == '' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest/summary.json
          git diff --cached --quiet || git commit -m "data: probe run $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash
          git push
