name: Daily probe
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      sample:
        description: 'Probe only a sample of this size (empty = whole registry)'
        required: false
        default: ''
concurrency:
  group: probe
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Probe the registry
        run: |
          if [ -n "${{ inputs.sample }}" ]; then
            npm run probe --silent -- --sample "${{ inputs.sample }}" --per-host 2 --out data/raw/probe-run.json
          else
            npm run probe --silent -- --all --concurrency 24 --out data/raw/probe-run.json
          fi
      - name: Build the site data and the D1 import
        run: |
          node --import tsx probe/build-data.ts --in data/raw/probe-run.json --out data/latest
          node --import tsx probe/to-sql.ts --in data/latest --out data/latest/import.sql
      - name: Keep the raw run as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: probe-${{ github.run_id }}
          path: |
            data/raw/probe-run.json
            data/latest/servers.json
          retention-days: 90
          compression-level: 9
      - name: Import into D1
        if: ${{ inputs.sample == '' && env.CLOUDFLARE_API_TOKEN != '' }}
        working-directory: site
        run: npx wrangler d1 execute mcp-pulse --remote --file=../data/latest/import.sql
      - name: Say when the import was skipped
        if: ${{ inputs.sample == '' && env.CLOUDFLARE_API_TOKEN == '' }}
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set, so the run was not imported into D1."
      - name: Commit the summary
        if: ${{ inputs.sample == '' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest/summary.json
          git diff --cached --quiet || git commit -m "data: probe run $(date -u +%Y-%m-%d)"
          git push
