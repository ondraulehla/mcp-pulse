name: Daily probe
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      sample:
        description: 'Probe only a sample of this size (empty = whole registry)'
        required: false
        default: ''
concurrency:
  group: probe
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    # The probe takes about an hour. Counting with count_tokens is limited to 100 requests a minute, so a day with many changed servers takes longer.
    timeout-minutes: 345
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Exact Claude counts come from the free count_tokens endpoint. Without the key the run keeps the o200k estimate only.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch the previous run's servers.json and the Claude count cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/previous data/cache
          # The run artifact is uploaded after a successful import, so the newest one is also the state of D1.
          # upload-artifact strips the common parent directory, so look for the files wherever they landed.
          for id in $(gh run list --workflow "Daily probe" --status success --limit 10 --json databaseId -q '.[].databaseId'); do
            if gh run download "$id" --name "probe-$id" --dir data/previous 2>/dev/null; then echo "previous run $id"; break; fi
          done
          f=$(find data/previous -name servers.json | head -1); test -n "$f" && cp "$f" data/previous/servers.json || echo "::notice::No previous run found, importing everything."
          h=$(find data/previous -name hosts.json | head -1); test -n "$h" && cp "$h" data/previous/hosts.json || true
          # The count cache is uploaded before the import, so counting progress survives a failed import.
          for id in $(gh run list --workflow "Daily probe" --limit 10 --json databaseId -q '.[].databaseId'); do
            if gh run download "$id" --name "claude-cache-$id" --dir data/cache 2>/dev/null; then echo "count cache from run $id"; break; fi
          done
          c=$(find data/cache -name servers.json | head -1); test -n "$c" && cp "$c" data/cache/servers.json || { test -f data/previous/servers.json && cp data/previous/servers.json data/cache/servers.json && echo "count cache from the previous run" || echo "::notice::No count cache found."; }
      - name: Probe the registry
        run: |
          if [ -n "${{ inputs.sample }}" ]; then
            npm run probe --silent -- --sample "${{ inputs.sample }}" --per-host 2 --out data/raw/probe-run.json --claude-cache data/cache/servers.json
          else
            npm run probe --silent -- --all --concurrency 24 --out data/raw/probe-run.json --claude-cache data/cache/servers.json
          fi
      - name: Build the site data and the D1 import
        run: |
          node --import tsx probe/build-data.ts --in data/raw/probe-run.json --out data/latest
          if [ -f data/previous/servers.json ]; then
            node --import tsx probe/to-sql.ts --in data/latest --out data/latest/import.sql --previous data/previous/servers.json --previous-hosts data/previous/hosts.json
          else
            node --import tsx probe/to-sql.ts --in data/latest --out data/latest/import.sql
          fi
      - name: Keep the Claude counts as a cache
        if: ${{ inputs.sample == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: claude-cache-${{ github.run_id }}
          path: data/latest/servers.json
          retention-days: 30
          compression-level: 9
      - name: Apply the schema
        # Every statement is idempotent: CREATE ... IF NOT EXISTS and DROP ... IF EXISTS.
        if: ${{ inputs.sample == '' && env.CLOUDFLARE_API_TOKEN != '' }}
        working-directory: site
        run: npx wrangler d1 execute mcp-pulse --remote --file=schema.sql
      - name: Import into D1
        if: ${{ inputs.sample == '' && env.CLOUDFLARE_API_TOKEN != '' }}
        working-directory: site
        run: npx wrangler d1 execute mcp-pulse --remote --file=../data/latest/import.sql
      - name: Keep the run as an artifact
        # After the import, so the next run diffs against what D1 really holds. A sample run keeps its raw file only.
        if: ${{ inputs.sample == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: probe-${{ github.run_id }}
          path: |
            data/raw/probe-run.json
            data/latest/servers.json
            data/latest/hosts.json
          retention-days: 90
          compression-level: 9
      - name: Tell IndexNow which pages changed
        if: ${{ inputs.sample == '' && env.CLOUDFLARE_API_TOKEN != '' }}
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: node --import tsx probe/indexnow.ts --changed data/latest/changed.json
      - name: Say when the import was skipped
        if: ${{ inputs.sample == '' && env.CLOUDFLARE_API_TOKEN == '' }}
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set, so the run was not imported into D1."
      - name: Commit the summary
        if: ${{ inputs.sample == '' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest/summary.json
          git diff --cached --quiet || git commit -m "data: probe run $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash
          git push
