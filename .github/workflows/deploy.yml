name: Deploy site
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        working-directory: site
        run: npm run build
      - name: Deploy
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        working-directory: site
        run: npx wrangler deploy
      - name: Say when the deploy was skipped
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set, so the site was built but not deployed."

