name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -p packages/mcpcost/tsconfig.json --noEmit
      - run: npm test --workspaces --if-present
      - run: node --test ".github/actions/*.test.mjs"
      - run: npm run build -w site
  action:
    name: the GitHub Action against two public servers
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - id: budget
        uses: ./
        with:
          config: .github/examples/mcp-budget.json
          budget: 5000
      - run: 'echo "tokens=${{ steps.budget.outputs.tokens }} servers=${{ steps.budget.outputs.servers }} over=${{ steps.budget.outputs.over-budget }}"'
      - name: the action fails above the budget
        id: fail
        continue-on-error: true
        uses: ./
        with:
          config: .github/examples/mcp-budget.json
          budget: 10
          comment: false
      - run: test "${{ steps.fail.outcome }}" = failure
